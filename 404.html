	<script type="speculationrules">
	{
		"prefetch": [{
			"where": { "href_matches": "/*.html" },
			"eagerness": "moderate"
		}],
		"prerender": [{
			"where": { "href_matches": "/*.html" },
			"eagerness": "conservative"
		}]
	}
	</script>
	<script>
	(function () {
		if (!window.IntersectionObserver) return;
		var seen = Object.create(null);
		function warm(url) {
			if (!url || seen[url] || /\.(webp|mp4|css|js)(\?|$)/i.test(url)) return;
			if (url.charAt(0) === "#" || url.indexOf("mailto:") === 0) return;
			// same-origin HTML only
			try {
				var u = new URL(url, location.href);
				if (u.origin !== location.origin) return;
				if (!/\.html$/i.test(u.pathname) && u.pathname !== "/" && !u.pathname.endsWith("/")) return;
			} catch (e) { return; }
			seen[url] = 1;
			var l = document.createElement("link");
			l.rel = "prefetch";
			l.href = url;
			l.as = "document";
			document.head.appendChild(l);
		}
		function bind(root) {
			root.addEventListener("pointerenter", function (e) {
				var a = e.target.closest && e.target.closest("a[href]");
				if (a) warm(a.getAttribute("href"));
			}, { passive: true });
			root.addEventListener("focusin", function (e) {
				var a = e.target.closest && e.target.closest("a[href]");
				if (a) warm(a.getAttribute("href"));
			});
		}
		bind(document.querySelector(".site-nav") || document.body);
		bind(document.querySelector("main") || document.body);
		// Prefetch likely next category on idle
		if ("requestIdleCallback" in window) {
			requestIdleCallback(function () {
				document.querySelectorAll(".page-nav a[href], .gallery-card[href]").forEach(function (a) {
					warm(a.getAttribute("href"));
				});
			}, { timeout: 2000 });
		}
	})();
	</script>
